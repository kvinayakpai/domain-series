name: Gemini on the four Store 014 questions (3-hourly, 20 runs)
# Each run makes at most 2 Gemini requests on the next unfinished condition and saves the conversation to
# gemini-four/state/. A scheduled task touches gemini-four/tick.txt every 3 hours to start a run. Plan: project doc
# "gemini-four-questions-3-hourly-plan-2026-11-25".
on:
  push:
    branches: [gemini-four-questions]
    paths: ["gemini-four/tick.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: gemini-four
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL: gemini-3.8-flash
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DOMAIN_SERIES }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: gemini-four-questions }
      - name: Load Store 014
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::no GEMINI_API_KEY_DOMAIN_SERIES secret"; exit 1; }
          python3 auto-ontology-demo/seed_store014.py > /tmp/store014.sql
          psql -h localhost -U postgres -q -c "CREATE DATABASE store014"
          psql -h localhost -U postgres -d store014 -v ON_ERROR_STOP=1 -q -f /tmp/store014.sql
          pip install --quiet requests psycopg2-binary
      - name: Run (at most 2 requests)
        run: python3 gemini-four/run.py
      - name: Save state
        if: always()
        run: |
          python3 auto-ontology-demo/scrub.py gemini-four/state || true
          if grep -rEq "AIza[0-9A-Za-z_-]{30,}" gemini-four/state; then echo "::error::key in state"; exit 1; fi
          git config user.name github-actions; git config user.email actions@github.com
          git add gemini-four/state; git commit -q -m "Gemini four questions: run state" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin gemini-four-questions && git push -q origin HEAD:gemini-four-questions && break; sleep $((RANDOM % 10 + 3)); done
