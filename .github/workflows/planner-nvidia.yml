name: Planner test, NVIDIA models (three-layer instructions)

# Each model writes plans for the 55 questions (sets 8 and 9); code checks and runs them. Starts on a push that changes this file.
on:
  push:
    branches: [refusal-bench-v2]
    paths:
      - ".github/workflows/planner-nvidia.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RESULTS: refusal-bench/results/planner-nvidia-run-${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        model: ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "moonshotai/kimi-k3.1-pro", "minimaxai/minimax-m3.1-flash", "mistralai/mistral-large-4-1t-a52b"]
    env:
      MODEL: ${{ matrix.model }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      INSTR_V2: "1"
      TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --quiet requests rdflib pyshacl owlrl
      - name: Checks that need no model
        run: python3 refusal-bench/ontology/planner_tests.py
      - name: Run the planner over the 55 questions
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then echo "::error::needs the NVIDIA_API_KEY secret"; exit 1; fi
          name=$(echo "$MODEL" | tr '/.' '__')
          python3 refusal-bench/ontology/plan_eval2.py "$RESULTS/$name" refusal-bench/questions-plan-v2.json
      - name: Take the key out and commit the results
        if: always()
        run: |
          python3 auto-ontology-demo/scrub.py "$RESULTS"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add "$RESULTS" || true
          git commit -m "Planner test results: $MODEL" || true
          for i in 1 2 3 4 5; do git pull --no-rebase -q && git push -q && break || sleep 5; done
