name: Auto-Ontology demo (Store 014)

# Runs NVIDIA's open-source Auto-Ontology on Store 014's June records, on GitHub's own
# machine. auto-ontology-demo/run-config.env picks the models: NVIDIA's own hosted models
# (MODELS=nvidia, with a free key from build.nvidia.com in the NVIDIA_API_KEY secret) or a
# small open model served by Ollama (MODELS=ollama, no keys), or Google's Gemini models
# (MODELS=gemini, with the GEMINI_API_KEY_DOMAIN_SERIES secret; embeddings stay local). With MODELS=nvidia,
# EMBEDDINGS=local keeps the Ollama runs' local embeddings and reranking. The drafted ontology, its
# answers and the logs are committed back to this branch under auto-ontology-demo/results,
# with the run's passwords and the key taken out first.

on:
  push:
    branches: [auto-ontology-demo]
    paths:
      - "auto-ontology-demo/**"
      - "!auto-ontology-demo/results/**"
      - ".github/workflows/auto-ontology-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-ontology-demo-${{ github.sha }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NVIDIA_COMMIT: 43fa2d3ac3cb00f79cce23b76d57a002b0cb0168
      CHAT_MODELS: "qwen3:4b-instruct-2507-q4_K_M qwen3:4b-instruct qwen3:4b"
      # A stronger model answers the questions once the draft is done (empty: the same model).
      ANSWER_MODELS: "qwen2.5:7b-instruct-q4_K_M qwen2.5:7b-instruct qwen2.5:7b"
      EMBED_LOCAL_MODEL: nomic-embed-text
      LOCAL_MODEL_NAME: openai/small-open-model
      RESULTS: auto-ontology-demo/results/run-${{ github.run_number }}
      AO: /tmp/ao
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DOMAIN_SERIES }}
      GEMINI_ENDPOINT: https://generativelanguage.googleapis.com/v1beta/openai
    steps:
      - uses: actions/checkout@v4

      - name: Choose the models
        run: |
          MODELS=$(grep -E '^MODELS=' auto-ontology-demo/run-config.env | tail -1 | cut -d= -f2 | tr -d '[:space:]')
          case "$MODELS" in
            nvidia)
              if [ -z "$NVIDIA_API_KEY" ]; then
                echo "::error::MODELS=nvidia needs the NVIDIA_API_KEY repository secret"
                exit 1
              fi ;;
            gemini)
              if [ -z "$GEMINI_API_KEY" ]; then
                echo "::error::MODELS=gemini needs the GEMINI_API_KEY_DOMAIN_SERIES repository secret"
                exit 1
              fi ;;
            ollama) ;;
            *)
              echo "::error::run-config.env: MODELS must be nvidia, gemini or ollama, not '$MODELS'"
              exit 1 ;;
          esac
          EMBEDDINGS=$(grep -E '^EMBEDDINGS=' auto-ontology-demo/run-config.env | tail -1 | cut -d= -f2 | tr -d '[:space:]')
          if [ "$MODELS" = ollama ] || [ "$MODELS" = gemini ]; then EMBEDDINGS=local; fi
          GEMINI_MODEL=$(grep -E '^GEMINI_MODEL=' auto-ontology-demo/run-config.env | tail -1 | cut -d= -f2 | tr -d '[:space:]')
          GEMINI_NON_REASONING_MODEL=$(grep -E '^GEMINI_NON_REASONING_MODEL=' auto-ontology-demo/run-config.env | tail -1 | cut -d= -f2 | tr -d '[:space:]')
          echo "GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}" >> "$GITHUB_ENV"
          echo "GEMINI_NON_REASONING_MODEL=${GEMINI_NON_REASONING_MODEL:-${GEMINI_MODEL:-gemini-3.8-flash}}" >> "$GITHUB_ENV"
          if [ -z "$EMBEDDINGS" ]; then EMBEDDINGS=nvidia; fi
          case "$EMBEDDINGS" in
            nvidia|local) ;;
            *)
              echo "::error::run-config.env: EMBEDDINGS must be nvidia or local, not '$EMBEDDINGS'"
              exit 1 ;;
          esac
          echo "MODELS=$MODELS" >> "$GITHUB_ENV"
          echo "EMBEDDINGS=$EMBEDDINGS" >> "$GITHUB_ENV"
          echo "Models: $MODELS. Embeddings and reranking: $EMBEDDINGS."

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
          nproc; free -g

      - name: Fetch NVIDIA Auto-Ontology at a fixed commit
        run: |
          git init -q "$AO"
          git -C "$AO" fetch -q --depth 1 https://github.com/NVIDIA/auto-ontology.git "$NVIDIA_COMMIT"
          git -C "$AO" checkout -q FETCH_HEAD
          git -C "$AO" log -1 --format='%H %cd'

      - name: Write settings
        run: |
          PG=$(openssl rand -hex 16); ADMIN=$(openssl rand -hex 16); SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$PG"; echo "::add-mask::$ADMIN"; echo "::add-mask::$SECRET"
          if [ "$MODELS" = nvidia ]; then
            # NVIDIA's own model settings, as its .env.example names them at this commit, with the key.
            # With EMBEDDINGS=local, embeddings and reranking come from the model adapter instead.
            python3 - "$AO/.env.example" > /tmp/models.env <<'PY'
          import os, sys
          local = os.environ.get("EMBEDDINGS") == "local"
          prefixes = ("DEFAULT_MODELS_", "REASONING_", "NON_REASONING_") + (() if local else ("EMBED_", "RERANK_"))
          for line in open(sys.argv[1]):
              line = line.strip()
              if line.startswith(prefixes) and "=" in line:
                  key, value = line.split("=", 1)
                  print(f"{key}={os.environ['NVIDIA_API_KEY'] if key.endswith('_API_KEY') else value}")
          if local:
              model = os.environ["EMBED_LOCAL_MODEL"]
              print("EMBED_API_KEY=local")
              print("EMBED_ENDPOINT=http://model-adapter:8000/v1")
              print(f"EMBED_MODEL={model}")
              print("RERANK_API_KEY=local")
              print("RERANK_ENDPOINT=http://model-adapter:8000/v1/rerank")
              print(f"RERANK_MODEL={model}")
          print("LLM_INVOKE_TIMEOUT_S=600")
          PY
          elif [ "$MODELS" = gemini ]; then
            # Gemini answers chat through its OpenAI-compatible endpoint; embeddings and reranking come from the adapter.
            cat > /tmp/models.env <<EOF
          DEFAULT_MODELS_API_KEY=$GEMINI_API_KEY
          DEFAULT_MODELS_ENDPOINT=$GEMINI_ENDPOINT
          DEFAULT_MODELS_MODEL=$GEMINI_MODEL
          REASONING_API_KEY=$GEMINI_API_KEY
          REASONING_ENDPOINT=$GEMINI_ENDPOINT
          REASONING_MODEL=$GEMINI_MODEL
          NON_REASONING_API_KEY=$GEMINI_API_KEY
          NON_REASONING_ENDPOINT=$GEMINI_ENDPOINT
          NON_REASONING_MODEL=$GEMINI_NON_REASONING_MODEL
          EMBED_API_KEY=local
          EMBED_ENDPOINT=http://model-adapter:8000/v1
          EMBED_MODEL=$EMBED_LOCAL_MODEL
          RERANK_API_KEY=local
          RERANK_ENDPOINT=http://model-adapter:8000/v1/rerank
          RERANK_MODEL=$EMBED_LOCAL_MODEL
          LLM_INVOKE_TIMEOUT_S=600
          EOF
          else
            cat > /tmp/models.env <<EOF
          DEFAULT_MODELS_API_KEY=ollama
          DEFAULT_MODELS_ENDPOINT=http://model-adapter:8000/v1
          DEFAULT_MODELS_MODEL=$LOCAL_MODEL_NAME
          REASONING_API_KEY=ollama
          REASONING_ENDPOINT=http://model-adapter:8000/v1
          REASONING_MODEL=$LOCAL_MODEL_NAME
          NON_REASONING_API_KEY=ollama
          NON_REASONING_ENDPOINT=http://model-adapter:8000/v1
          NON_REASONING_MODEL=$LOCAL_MODEL_NAME
          EMBED_API_KEY=local
          EMBED_ENDPOINT=http://model-adapter:8000/v1
          EMBED_MODEL=$EMBED_LOCAL_MODEL
          RERANK_API_KEY=local
          RERANK_ENDPOINT=http://model-adapter:8000/v1/rerank
          RERANK_MODEL=$EMBED_LOCAL_MODEL
          LLM_INVOKE_TIMEOUT_S=1800
          LLM_MAX_INFLIGHT=2
          PII_LLM_MAX_WORKERS=2
          EOF
          fi
          cat > "$AO/.env" <<EOF
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$PG
          POSTGRES_DATABASE=auto_ontology
          CONNECTION_STRINGS=postgresql://postgres:$PG@postgres:5432/store014
          PGADMIN_EMAIL=admin@store014.example
          PGADMIN_PASSWORD=$ADMIN
          APP_URL=http://localhost:3000
          AUTO_ONTOLOGY_MCP_PUBLIC_URL=http://localhost:3003
          INGESTION_SERVICE_URL=http://localhost:3002
          AUTO_ONTOLOGY_ADMIN_EMAIL=admin@store014.example
          AUTO_ONTOLOGY_ADMIN_PASSWORD=$ADMIN
          AUTH_SECRET=$SECRET
          EOF
          cat /tmp/models.env >> "$AO/.env"
          echo "Model settings:"; grep -v '_API_KEY=' /tmp/models.env
          setting() { grep -E "^$1=" /tmp/models.env | tail -1 | cut -d= -f2-; }
          {
            echo "AUTO_ONTOLOGY_ADMIN_EMAIL=admin@store014.example"
            echo "AUTO_ONTOLOGY_ADMIN_PASSWORD=$ADMIN"
            echo "SCRUB=$PG|$ADMIN|$SECRET"
            echo "DEMO_DIR=$GITHUB_WORKSPACE/auto-ontology-demo"
            echo "DC=docker compose --project-directory $AO -f $AO/docker-compose.yml -f $GITHUB_WORKSPACE/auto-ontology-demo/compose.demo.yml"
            if [ "$MODELS" != ollama ]; then
              echo "NV_CHAT_ENDPOINT=$(setting REASONING_ENDPOINT)"
              echo "NV_CHAT_MODEL=$(setting REASONING_MODEL)"
              echo "NV_NON_REASONING_MODEL=$(setting NON_REASONING_MODEL)"
            fi
            if [ "$MODELS" = nvidia ] && [ "$EMBEDDINGS" = nvidia ]; then
              echo "NV_EMBED_ENDPOINT=$(setting EMBED_ENDPOINT)"
              echo "NV_EMBED_MODEL=$(setting EMBED_MODEL)"
              echo "NV_RERANK_ENDPOINT=$(setting RERANK_ENDPOINT)"
              echo "NV_RERANK_MODEL=$(setting RERANK_MODEL)"
            fi
          } >> "$GITHUB_ENV"

      - name: Start Postgres (and, for local models, Ollama and the model adapter)
        run: |
          if [ "$EMBEDDINGS" = local ]; then $DC up -d postgres ollama model-adapter; else $DC up -d postgres; fi
          for i in $(seq 60); do docker exec postgres pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          if [ "$EMBEDDINGS" = local ]; then docker exec ollama ollama --version; fi

      - name: Pull the local embedding model
        if: env.MODELS != 'ollama' && env.EMBEDDINGS == 'local'
        run: |
          docker exec ollama ollama pull "$EMBED_LOCAL_MODEL" >/dev/null
          docker exec ollama ollama list
          for i in $(seq 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          time curl -sf http://localhost:8000/v1/embeddings -H 'Content-Type: application/json' -d "{\"model\":\"$EMBED_LOCAL_MODEL\",\"input\":[\"5 kg atta\"],\"input_type\":\"query\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['data'][0]['embedding']; print('dimensions', len(v), 'nonzero', sum(1 for x in v if x))"

      - name: Check the hosted models answer
        if: env.MODELS != 'ollama'
        run: |
          if [ "$MODELS" = gemini ]; then HOSTED_KEY="$GEMINI_API_KEY"; else HOSTED_KEY="$NVIDIA_API_KEY"; fi
          ask() {  # ask <name> <url> <json>: prints the HTTP status, and the body when it fails
            code=$(curl -sS -o "/tmp/$1.json" -w '%{http_code}' --max-time 300 "$2" \
              -H "Authorization: Bearer $HOSTED_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' -d "$3")
            echo "$1: HTTP $code"
            [ "$code" = 200 ] || { head -c 800 "/tmp/$1.json"; echo; return 1; }
          }
          ask chat "$NV_CHAT_ENDPOINT/chat/completions" \
            "{\"model\":\"$NV_CHAT_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Name one Indian grocery staple, in one word.\"}],\"max_tokens\":2048}"
          python3 -c "import json; d=json.load(open('/tmp/chat.json')); m=d['choices'][0]['message']; print(d.get('model'), '|', repr((m.get('content') or '')[:120]), '|', d.get('usage'))"
          if [ "$EMBEDDINGS" = nvidia ]; then
            ask embeddings "$NV_EMBED_ENDPOINT/embeddings" \
              "{\"model\":\"$NV_EMBED_MODEL\",\"input\":[\"5 kg atta\"],\"input_type\":\"query\"}"
            python3 -c "import json; d=json.load(open('/tmp/embeddings.json')); print('dimensions', len(d['data'][0]['embedding']))"
            # Reranking only serves one of the answer flows, so a refusal here is reported, not fatal.
            ask rerank "$NV_RERANK_ENDPOINT" \
              "{\"model\":\"$NV_RERANK_MODEL\",\"query\":{\"text\":\"5 kg atta\"},\"passages\":[{\"text\":\"wheat flour, 5 kg bag\"},{\"text\":\"UPI payment declined\"}]}" \
              && head -c 300 /tmp/rerank.json && echo || true
          fi

      - name: Pull the open models
        if: env.MODELS == 'ollama'
        run: |
          for tag in $CHAT_MODELS; do
            if docker exec ollama ollama pull "$tag" >/dev/null; then CHAT_BASE="$tag"; break; fi
          done
          test -n "$CHAT_BASE"
          echo "CHAT_BASE=$CHAT_BASE" >> "$GITHUB_ENV"
          docker exec ollama ollama pull "$EMBED_LOCAL_MODEL" >/dev/null
          docker exec ollama sh -c "printf 'FROM %s\nPARAMETER num_ctx 16384\nPARAMETER temperature 0.7\nPARAMETER top_p 0.8\nPARAMETER top_k 20\nPARAMETER repeat_penalty 1.05\n' '$CHAT_BASE' > /tmp/Modelfile && ollama create '$LOCAL_MODEL_NAME' -f /tmp/Modelfile"
          if [ -n "$ANSWER_MODELS" ]; then
            for tag in $ANSWER_MODELS; do
              if docker exec ollama ollama pull "$tag" >/dev/null; then ANSWER_BASE="$tag"; break; fi
            done
            test -n "$ANSWER_BASE"
            echo "ANSWER_BASE=$ANSWER_BASE" >> "$GITHUB_ENV"
            echo "ANSWER_MODEL=openai/answer-model" >> "$GITHUB_ENV"
            docker exec ollama sh -c "printf 'FROM %s\nPARAMETER num_ctx 16384\nPARAMETER temperature 0.7\nPARAMETER top_p 0.8\nPARAMETER top_k 20\nPARAMETER repeat_penalty 1.05\n' '$ANSWER_BASE' > /tmp/Modelfile2 && ollama create openai/answer-model -f /tmp/Modelfile2"
          fi
          docker exec ollama ollama list

      - name: Check the open models answer
        if: env.MODELS == 'ollama'
        run: |
          for i in $(seq 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          time curl -sf http://localhost:8000/v1/chat/completions -H 'Content-Type: application/json' -d "{\"model\":\"$LOCAL_MODEL_NAME\",\"messages\":[{\"role\":\"user\",\"content\":\"Name one Indian grocery staple.\"}],\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"staple\",\"schema\":{\"type\":\"object\",\"properties\":{\"item\":{\"type\":\"string\"}},\"required\":[\"item\"]}}}}"
          echo
          for i in $(seq 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          time curl -sf http://localhost:8000/v1/embeddings -H 'Content-Type: application/json' -d '{"model":"nomic-embed-text","input":["5 kg atta"],"input_type":"query"}' | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['data'][0]['embedding']; print('dimensions', len(v), 'nonzero', sum(1 for x in v if x))"

      - name: Load Store 014
        run: |
          python3 auto-ontology-demo/seed_store014.py > /tmp/store014.sql
          docker exec postgres psql -U postgres -q -c "CREATE DATABASE store014"
          docker exec -i postgres psql -U postgres -d store014 -v ON_ERROR_STOP=1 -q < /tmp/store014.sql
          docker exec postgres psql -U postgres -d store014 -Atc "select table_schema || '.' || table_name from information_schema.tables where table_schema in ('store','warehouse','payments') order by 1"

      - name: Build and start Auto-Ontology
        run: |
          $DC build auto-ontology auto-ontology-frontend
          $DC up -d auto-ontology-frontend
          for i in $(seq 120); do
            curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ | grep -qE '^(2|3)' && break
            sleep 10
          done
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          df -h /

      - name: Draft the ontology and ask the questions
        timeout-minutes: 300
        env:
          APP_URL: http://localhost:3000
          BUDGET_MIN: "280"
          CHECKPOINT_PUSH: "1"
          # After the first round of questions, enter Season 2's knowledge and ask again.
          EXPERT_LAYER: "1"
          RESERVE_MIN: "110"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 auto-ontology-demo/run_demo.py "$RESULTS"

      - name: Save the setup and the logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RESULTS/logs"
          for s in auto-ontology auto-ontology-ingestion-service auto-ontology-frontend auto-ontology-migrate auto-ontology-frontend-migrate model-adapter ollama; do
            docker inspect "$s" >/dev/null 2>&1 || continue
            docker logs --tail 5000 "$s" > "$RESULTS/logs/$s.log" 2>&1 || true
          done
          docker ps -a --format '{{.Names}}\t{{.Status}}' > "$RESULTS/logs/containers.txt" 2>&1 || true
          # Every question the agent was asked, the SQL it ran and how each episode ended.
          docker logs auto-ontology 2>&1 | grep -E -A3 "agent started for question|Executing ReAct agent SQL|ReAct episode|Agent completed: react_sql_agent" > "$RESULTS/logs/agent-trace.log" || true
          # How often NVIDIA's endpoints asked the run to slow down.
          docker logs auto-ontology 2>&1 | grep -cE "429|Too Many Requests|RateLimit" > "$RESULTS/logs/rate-limited-lines.txt" || true
          OLLAMA_VERSION=""
          if [ "$EMBEDDINGS" = local ]; then
            if [ "$MODELS" = ollama ]; then docker exec ollama ollama show "$LOCAL_MODEL_NAME" > "$RESULTS/logs/model.txt" 2>&1 || true; fi
            docker exec ollama ollama list >> "$RESULTS/logs/model.txt" 2>&1 || true
            OLLAMA_VERSION=$(docker exec ollama ollama --version 2>&1 | tail -1)
          fi
          OLLAMA_VERSION="$OLLAMA_VERSION" python3 - <<'PY' > "$RESULTS/setup.json"
          import json, os
          e = os.environ.get
          nvidia = e("MODELS") != "ollama"  # a hosted model, NVIDIA's or Gemini's
          local = e("EMBEDDINGS") == "local"
          print(json.dumps({
              "run_number": e("GITHUB_RUN_NUMBER"),
              "run_id": e("GITHUB_RUN_ID"),
              "nvidia_auto_ontology_commit": e("NVIDIA_COMMIT"),
              "models": e("MODELS"),
              "embeddings": e("EMBEDDINGS"),
              "chat_model": e("NV_CHAT_MODEL") if nvidia else e("CHAT_BASE"),
              "non_reasoning_model": e("NV_NON_REASONING_MODEL") if nvidia else e("CHAT_BASE"),
              "answer_model": e("NV_CHAT_MODEL") if nvidia else (e("ANSWER_BASE") or e("CHAT_BASE")),
              "embedding_model": f"{e('EMBED_LOCAL_MODEL')}, padded to 2048" if local else e("NV_EMBED_MODEL"),
              "rerank_model": "cosine similarity in model_adapter.py" if local else e("NV_RERANK_MODEL"),
              "ollama": e("OLLAMA_VERSION") or None,
              "runner": {"cpus": os.cpu_count()},
          }, indent=2))
          PY
          # The run's throwaway passwords and the NVIDIA and Gemini keys never leave the run.
          python3 auto-ontology-demo/scrub.py "$RESULTS"

      - name: Commit the results to this branch
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 auto-ontology-demo/scrub.py "$RESULTS"
          git add "$RESULTS"
          git commit -q -m "Auto-Ontology demo results (run ${{ github.run_number }})" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
