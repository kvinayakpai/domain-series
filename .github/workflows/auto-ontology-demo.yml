name: Auto-Ontology demo (Store 014)

# Runs NVIDIA's open-source Auto-Ontology on Store 014's June records, on GitHub's own
# machine, with a small open model served by Ollama in place of NVIDIA's hosted models.
# No keys or secrets. The drafted ontology, its answers and the logs are committed back
# to this branch under auto-ontology-demo/results.

on:
  push:
    branches: [auto-ontology-demo]
    paths:
      - "auto-ontology-demo/**"
      - "!auto-ontology-demo/results/**"
      - ".github/workflows/auto-ontology-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-ontology-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NVIDIA_COMMIT: 43fa2d3ac3cb00f79cce23b76d57a002b0cb0168
      CHAT_MODELS: "qwen3:4b-instruct-2507-q4_K_M qwen3:4b-instruct qwen3:4b"
      EMBED_LOCAL_MODEL: nomic-embed-text
      LOCAL_MODEL_NAME: openai/small-open-model
      RESULTS: auto-ontology-demo/results
      AO: /tmp/ao
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
          nproc; free -g

      - name: Fetch NVIDIA Auto-Ontology at a fixed commit
        run: |
          git init -q "$AO"
          git -C "$AO" fetch -q --depth 1 https://github.com/NVIDIA/auto-ontology.git "$NVIDIA_COMMIT"
          git -C "$AO" checkout -q FETCH_HEAD
          git -C "$AO" log -1 --format='%H %cd'

      - name: Write settings
        run: |
          PG=$(openssl rand -hex 16); ADMIN=$(openssl rand -hex 16); SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$PG"; echo "::add-mask::$ADMIN"; echo "::add-mask::$SECRET"
          cat > "$AO/.env" <<EOF
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$PG
          POSTGRES_DATABASE=auto_ontology
          CONNECTION_STRINGS=postgresql://postgres:$PG@postgres:5432/store014
          PGADMIN_EMAIL=admin@store014.example
          PGADMIN_PASSWORD=$ADMIN
          DEFAULT_MODELS_API_KEY=ollama
          DEFAULT_MODELS_ENDPOINT=http://ollama:11434/v1
          DEFAULT_MODELS_MODEL=$LOCAL_MODEL_NAME
          REASONING_API_KEY=ollama
          REASONING_ENDPOINT=http://ollama:11434/v1
          REASONING_MODEL=$LOCAL_MODEL_NAME
          NON_REASONING_API_KEY=ollama
          NON_REASONING_ENDPOINT=http://ollama:11434/v1
          NON_REASONING_MODEL=$LOCAL_MODEL_NAME
          EMBED_API_KEY=local
          EMBED_ENDPOINT=http://model-adapter:8000/v1
          EMBED_MODEL=$EMBED_LOCAL_MODEL
          RERANK_API_KEY=local
          RERANK_ENDPOINT=http://model-adapter:8000/v1/rerank
          RERANK_MODEL=$EMBED_LOCAL_MODEL
          APP_URL=http://localhost:3000
          AUTO_ONTOLOGY_MCP_PUBLIC_URL=http://localhost:3003
          INGESTION_SERVICE_URL=http://localhost:3002
          AUTO_ONTOLOGY_ADMIN_EMAIL=admin@store014.example
          AUTO_ONTOLOGY_ADMIN_PASSWORD=$ADMIN
          AUTH_SECRET=$SECRET
          LLM_INVOKE_TIMEOUT_S=1800
          LLM_MAX_INFLIGHT=2
          PII_LLM_MAX_WORKERS=2
          EOF
          {
            echo "AUTO_ONTOLOGY_ADMIN_EMAIL=admin@store014.example"
            echo "AUTO_ONTOLOGY_ADMIN_PASSWORD=$ADMIN"
            echo "SCRUB=$PG|$ADMIN|$SECRET"
            echo "DEMO_DIR=$GITHUB_WORKSPACE/auto-ontology-demo"
            echo "DC=docker compose --project-directory $AO -f $AO/docker-compose.yml -f $GITHUB_WORKSPACE/auto-ontology-demo/compose.demo.yml"
          } >> "$GITHUB_ENV"

      - name: Start Postgres, Ollama and the model adapter
        run: |
          $DC up -d postgres ollama model-adapter
          for i in $(seq 60); do docker exec postgres pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec ollama ollama --version

      - name: Pull the open models
        run: |
          for tag in $CHAT_MODELS; do
            if docker exec ollama ollama pull "$tag" >/dev/null; then CHAT_BASE="$tag"; break; fi
          done
          test -n "$CHAT_BASE"
          echo "CHAT_BASE=$CHAT_BASE" >> "$GITHUB_ENV"
          docker exec ollama ollama pull "$EMBED_LOCAL_MODEL" >/dev/null
          docker exec ollama sh -c "printf 'FROM %s\nPARAMETER num_ctx 16384\nPARAMETER temperature 0\n' '$CHAT_BASE' > /tmp/Modelfile && ollama create '$LOCAL_MODEL_NAME' -f /tmp/Modelfile"
          docker exec ollama ollama list

      - name: Check the models answer
        run: |
          time curl -sf http://localhost:11434/v1/chat/completions -H 'Content-Type: application/json' -d "{\"model\":\"$LOCAL_MODEL_NAME\",\"messages\":[{\"role\":\"user\",\"content\":\"Name one Indian grocery staple.\"}],\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"staple\",\"schema\":{\"type\":\"object\",\"properties\":{\"item\":{\"type\":\"string\"}},\"required\":[\"item\"]}}}}"
          echo
          for i in $(seq 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          time curl -sf http://localhost:8000/v1/embeddings -H 'Content-Type: application/json' -d '{"model":"nomic-embed-text","input":["5 kg atta"],"input_type":"query"}' | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['data'][0]['embedding']; print('dimensions', len(v), 'nonzero', sum(1 for x in v if x))"

      - name: Load Store 014
        run: |
          python3 auto-ontology-demo/seed_store014.py > /tmp/store014.sql
          docker exec postgres psql -U postgres -q -c "CREATE DATABASE store014"
          docker exec -i postgres psql -U postgres -d store014 -v ON_ERROR_STOP=1 -q < /tmp/store014.sql
          docker exec postgres psql -U postgres -d store014 -Atc "select table_schema || '.' || table_name from information_schema.tables where table_schema in ('store','warehouse','payments') order by 1"

      - name: Build and start Auto-Ontology
        run: |
          $DC build auto-ontology auto-ontology-frontend
          $DC up -d auto-ontology-frontend
          for i in $(seq 120); do
            curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ | grep -qE '^(2|3)' && break
            sleep 10
          done
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          df -h /

      - name: Draft the ontology and ask the questions
        timeout-minutes: 300
        env:
          APP_URL: http://localhost:3000
          BUDGET_MIN: "280"
          CHECKPOINT_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 auto-ontology-demo/run_demo.py "$RESULTS"

      - name: Save the setup and the logs
        if: always()
        run: |
          mkdir -p "$RESULTS/logs"
          for s in auto-ontology auto-ontology-ingestion-service auto-ontology-frontend auto-ontology-migrate auto-ontology-frontend-migrate model-adapter ollama; do
            docker logs --tail 2000 "$s" > "$RESULTS/logs/$s.log" 2>&1 || true
          done
          docker ps -a --format '{{.Names}}\t{{.Status}}' > "$RESULTS/logs/containers.txt" 2>&1 || true
          docker exec ollama ollama show "$LOCAL_MODEL_NAME" > "$RESULTS/logs/model.txt" 2>&1 || true
          docker exec ollama ollama list >> "$RESULTS/logs/model.txt" 2>&1 || true
          OLLAMA_VERSION=$(docker exec ollama ollama --version 2>&1 | tail -1)
          python3 - <<PY > "$RESULTS/setup.json"
          import json, os
          print(json.dumps({
              "run_number": "${{ github.run_number }}",
              "run_id": "${{ github.run_id }}",
              "nvidia_auto_ontology_commit": os.environ["NVIDIA_COMMIT"],
              "chat_model": os.environ.get("CHAT_BASE"),
              "embedding_model": os.environ["EMBED_LOCAL_MODEL"],
              "ollama": "$OLLAMA_VERSION",
              "runner": {"cpus": os.cpu_count()},
          }, indent=2))
          PY
          # Throwaway passwords never leave the run.
          if [ -n "$SCRUB" ]; then
            grep -rlE "$SCRUB" "$RESULTS" 2>/dev/null | xargs -r sed -i -E "s/$SCRUB/[redacted]/g"
          fi

      - name: Commit the results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULTS"
          git commit -q -m "Auto-Ontology demo results (run ${{ github.run_number }})" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
