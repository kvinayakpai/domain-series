[project]
name = "domain-series"
version = "0.1.0"
description = "Python tooling for the Why Domain Matters site: analysis, decks, videos, the ontology checks and the Auto-Ontology demo."
requires-python = ">=3.12"
# Site-build and analysis scripts (npm run analysis / decks / video).
# Exact versions, so a rebuild gives the same numbers; bump them together and rerun `npm run analysis`.
dependencies = [
  "duckdb==2.0.1",
  "numpy==2.5.5",
  "pandas==3.1.1",
  "matplotlib==3.11.2",
  "nbformat==5.11.1",
  "nbconvert==7.17.2",
  "ipykernel==7.4.0",
  "playwright==1.65.2",
]

[project.optional-dependencies]
# npm run ontology (Owlready2 runs the HermiT reasoner, so it also needs Java).
ontology = ["rdflib==7.6.0", "pyshacl==0.40.2", "owlrl==7.6.2", "owlready2==0.51", "pyoxigraph==0.5.13", "pylode==3.6.1"]

[tool.setuptools]
py-modules = []
