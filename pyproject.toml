[project]
name = "domain-series"
version = "0.1.0"
description = "Python tooling for the Why Domain Matters site: analysis, decks, videos, the ontology checks and the Auto-Ontology demo."
requires-python = ">=3.10"
# Site-build and analysis scripts (npm run analysis / decks / video).
dependencies = [
  "duckdb",
  "numpy",
  "pandas",
  "matplotlib",
  "nbformat",
  "nbconvert",
  "ipykernel",
  "playwright",
]

[project.optional-dependencies]
# npm run ontology (Owlready2 runs the HermiT reasoner, so it also needs Java).
ontology = ["rdflib", "pyshacl", "owlrl", "owlready2", "pyoxigraph", "pylode"]

[tool.setuptools]
py-modules = []
