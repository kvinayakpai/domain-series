name: store_014
version: "1.0.0"
config-version: 2
profile: store_014

model-paths: ["models"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

vars:
  data_dir: data  # the folder holding the CSV records; get_data.py fills it

models:
  store_014:
    +materialized: view

data_tests:
  store_014:
    domain:
      +severity: warn
      +store_failures: true
