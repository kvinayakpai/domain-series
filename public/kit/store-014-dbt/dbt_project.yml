name: store_014
version: "1.0.0"
config-version: 2
profile: store_014

model-paths: ["models"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

vars:
  data_dir: data  # the folder holding the CSV records; get_data.py fills it
  window_start: '2026-06-01'   # the window the records cover: first day ...
  window_end: '2026-06-29'     # ... and the day after its last
  history_start: '2026-05-04'  # the silent-run baseline starts here, before the window
  week1_end: '2026-06-07'      # no_weekly_sales_halve compares window_start..week1_end
  week2_start: '2026-06-08'    # with week2_start..week2_end
  week2_end: '2026-06-14'
  review_ts: '2026-06-29 09:00'  # the review at which a refund counts as late

models:
  store_014:
    +materialized: view

data_tests:
  store_014:
    domain:
      +severity: warn
      +store_failures: true
