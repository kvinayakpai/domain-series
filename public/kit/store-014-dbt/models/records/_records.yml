version: 2

models:
  - name: products
    description: "products.csv."
    meta: {"file": "products.csv"}
  - name: pos_lines
    description: "Till lines: written by a scan of each item at the till. Looks at the shelf (in part)."
    meta: {"file": "pos-lines-may-june.csv", "written_by": "a scan of each item at the till", "looks_at": ["shelf"], "map_id": "lines"}
  - name: daily_sales
    description: "daily-sales-june.csv."
    meta: {"file": "daily-sales-june.csv"}
  - name: inventory_book
    description: "Book stock: written by the store's system, from receipts, sales, write-offs and counts. Looks at nothing itself; it is written from other records."
    meta: {"file": "inventory-book-june.csv", "written_by": "the store's system, from receipts, sales, write-offs and counts", "looks_at": [], "map_id": "book"}
  - name: forecasts
    description: "forecasts-june.csv."
    meta: {"file": "forecasts-june.csv"}
  - name: store_orders
    description: "store-orders-june.csv."
    meta: {"file": "store-orders-june.csv"}
  - name: goods_receipts
    description: "Goods receipts: written by a scan of the pallet label at the store, matched to the notice. Looks at nothing itself; it is written from other records."
    meta: {"file": "goods-receipts-june.csv", "written_by": "a scan of the pallet label at the store, matched to the notice", "looks_at": [], "map_id": "receipts"}
  - name: fresh_deliveries
    description: "fresh-deliveries-june.csv."
    meta: {"file": "fresh-deliveries-june.csv"}
  - name: stock_counts
    description: "Stock counts: written by staff counting the shelf and the backroom. Looks at the shelf, the backroom."
    meta: {"file": "stock-counts-june.csv", "written_by": "staff counting the shelf and the backroom", "looks_at": ["shelf", "backroom"], "map_id": "counts"}
  - name: shelf_audits
    description: "Shelf audits: written by a person looking at the shelf. Looks at the shelf."
    meta: {"file": "shelf-audits-june.csv", "written_by": "a person looking at the shelf", "looks_at": ["shelf"], "map_id": "audits"}
  - name: write_offs
    description: "write-offs-june.csv."
    meta: {"file": "write-offs-june.csv"}
  - name: shipments
    description: "shipments-june.csv."
    meta: {"file": "shipments-june.csv"}
  - name: notice_lines
    description: "Shipping notice: written by the warehouse system, from the pick confirmations. Looks at nothing itself; it is written from other records."
    meta: {"file": "shipping-notice-lines-june.csv", "written_by": "the warehouse system, from the pick confirmations", "looks_at": [], "map_id": "notice"}
  - name: picks
    description: "Pick confirmations: written by a scan of the slot's label as the picker takes the cases. Looks at a warehouse slot (in part)."
    meta: {"file": "dc-pick-confirmations-june.csv", "written_by": "a scan of the slot's label as the picker takes the cases", "looks_at": ["slot"], "map_id": "picks"}
  - name: pallets
    description: "Pallet labels: written by the warehouse system, from the notice; no pallet was weighed. Looks at nothing itself; it is written from other records."
    meta: {"file": "pallets-june.csv", "written_by": "the warehouse system, from the notice; no pallet was weighed", "looks_at": [], "map_id": "labels"}
  - name: dc_adjustments
    description: "Warehouse corrections: written by a count of a warehouse slot. Looks at a warehouse slot."
    meta: {"file": "dc-stock-adjustments-june.csv", "written_by": "a count of a warehouse slot", "looks_at": ["slot"], "map_id": "corrections"}
  - name: till_payments
    description: "Till payments: written by the till: the provider's answer, or its own timeout. Looks at nothing itself; it is written from other records."
    meta: {"file": "pos-payments-june.csv", "written_by": "the till: the provider's answer, or its own timeout", "looks_at": [], "map_id": "payments"}
  - name: psp_upi
    description: "Provider's UPI report: written by UPI's final status for every payment. Looks at the customer's bank account, the store's bank account."
    meta: {"file": "psp-upi-report-june.csv", "written_by": "UPI's final status for every payment", "looks_at": ["customer_account", "store_account"], "map_id": "provider"}
  - name: settlements
    description: "Settlements: written by the store's bank, from the provider's successes. Looks at nothing itself; it is written from other records."
    meta: {"file": "upi-settlements-june.csv", "written_by": "the store's bank, from the provider's successes", "looks_at": [], "map_id": "settlements"}
  - name: refunds
    description: "Refunds: written by the store, after a complaint. Looks at nothing itself; it is written from other records."
    meta: {"file": "upi-refunds-june.csv", "written_by": "the store, after a complaint", "looks_at": [], "map_id": "refunds"}
  - name: complaints
    description: "Complaints: written by a customer calling the store. Looks at the customer's bank account (in part)."
    meta: {"file": "customer-complaints-june.csv", "written_by": "a customer calling the store", "looks_at": ["customer_account"], "map_id": "complaints"}
