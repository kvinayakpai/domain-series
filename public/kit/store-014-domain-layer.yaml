# Store 014's domain layer. https://kvinayakpai.github.io/domain-series/kit/
# Strings are JSON strings, which YAML reads as they are.
about: "Store 014's domain layer, as the series Why Domain Matters built it: what writes each record and what it looks at, how often each join agrees, which record each headline KPI reads and what can contradict it, and the definitions, rules and views the scripted assistant was given. Give it to an agent with the schema. Built from https://kvinayakpai.github.io/domain-series/data/india-grocery/store-014-map.json and the three technical companions."
records:
  - id: "picks"
    name: "Pick confirmations"
    file: "dc-pick-confirmations-june.csv"
    written_by: "a scan of the slot's label as the picker takes the cases"
    looks_at:
      - "slot (in part)"
    sees: "where the picker stood, not what they took"
  - id: "notice"
    name: "Shipping notice"
    file: "shipping-notice-lines-june.csv"
    written_by: "the warehouse system, from the pick confirmations"
    looks_at: []
  - id: "labels"
    name: "Pallet labels"
    file: "pallets-june.csv"
    written_by: "the warehouse system, from the notice; no pallet was weighed"
    looks_at: []
  - id: "receipts"
    name: "Goods receipts"
    file: "goods-receipts-june.csv"
    written_by: "a scan of the pallet label at the store, matched to the notice"
    looks_at: []
  - id: "corrections"
    name: "Warehouse corrections"
    file: "dc-stock-adjustments-june.csv"
    written_by: "a count of a warehouse slot"
    looks_at:
      - "slot"
    sees: "what is left in a slot"
  - id: "book"
    name: "Book stock"
    file: "inventory-book-june.csv"
    written_by: "the store's system, from receipts, sales, write-offs and counts"
    looks_at: []
  - id: "lines"
    name: "Till lines"
    file: "pos-lines-may-june.csv"
    written_by: "a scan of each item at the till"
    looks_at:
      - "shelf (in part)"
    sees: "a sale proves the item was there; no sale proves nothing"
  - id: "counts"
    name: "Stock counts"
    file: "stock-counts-june.csv"
    written_by: "staff counting the shelf and the backroom"
    looks_at:
      - "shelf"
      - "backroom"
    sees: "what is on the shelf and in the backroom"
  - id: "audits"
    name: "Shelf audits"
    file: "shelf-audits-june.csv"
    written_by: "a person looking at the shelf"
    looks_at:
      - "shelf"
    sees: "whether the shelf has the item"
  - id: "payments"
    name: "Till payments"
    file: "pos-payments-june.csv"
    written_by: "the till: the provider's answer, or its own timeout"
    looks_at: []
  - id: "provider"
    name: "Provider's UPI report"
    file: "psp-upi-report-june.csv"
    written_by: "UPI's final status for every payment"
    looks_at:
      - "customer_account"
      - "store_account"
    sees: "whether the customer was debited and the store credited"
  - id: "settlements"
    name: "Settlements"
    file: "upi-settlements-june.csv"
    written_by: "the store's bank, from the provider's successes"
    looks_at: []
  - id: "refunds"
    name: "Refunds"
    file: "upi-refunds-june.csv"
    written_by: "the store, after a complaint"
    looks_at: []
  - id: "complaints"
    name: "Complaints"
    file: "customer-complaints-june.csv"
    written_by: "a customer calling the store"
    looks_at:
      - "customer_account (in part)"
    sees: "a customer's account, if they call"
unseen:
  - "pallet"
joins:
  - id: "picks-notice"
    records:
      - "picks"
      - "notice"
    joined_on: "shipment and line: item and cases"
    agree: "70 of 70"
    kind: "copy"
  - id: "notice-labels"
    records:
      - "notice"
      - "labels"
    joined_on: "pallet (SSCC): cases"
    agree: "30 of 30"
    kind: "copy"
  - id: "notice-receipts"
    records:
      - "notice"
      - "receipts"
    joined_on: "shipment and line: item and units"
    agree: "70 of 70"
    kind: "copy"
  - id: "receipts-counts"
    records:
      - "receipts"
      - "counts"
    joined_on: "item: the last receipt before each count survives it"
    agree: "9 of 10"
    kind: "observation"
  - id: "book-ledger"
    records:
      - "book"
      - "lines"
    joined_on: "item and day: yesterday's book, plus receipts and deliveries, minus sales and write-offs, plus counts"
    agree: "297 of 297"
    kind: "copy"
  - id: "book-counts"
    records:
      - "book"
      - "counts"
    joined_on: "item: the books against a count of shelf and backroom"
    agree: "4 of 25"
    kind: "observation"
  - id: "book-audits"
    records:
      - "book"
      - "audits"
    joined_on: "item and hour: stock on the books against a look at the shelf"
    agree: "86 of 88"
    kind: "observation"
  - id: "lines-payments"
    records:
      - "lines"
      - "payments"
    joined_on: "bill: every bill on the till lines has one approved payment"
    agree: "13851 of 13851"
    kind: "copy"
  - id: "payments-provider"
    records:
      - "payments"
      - "provider"
    joined_on: "RRN: approved UPI payments against the provider's status and amount"
    agree: "18384 of 18384"
    kind: "copy"
  - id: "timeouts-provider"
    records:
      - "payments"
      - "provider"
    joined_on: "amount and time: timeouts against the provider's final status"
    agree: "16 of 48"
    kind: "observation"
  - id: "provider-settlements"
    records:
      - "provider"
      - "settlements"
    joined_on: "day: each settlement against the previous day's successes"
    agree: "29 of 29"
    kind: "copy"
  - id: "provider-refunds"
    records:
      - "provider"
      - "refunds"
    joined_on: "RRN: each refund names a success for the same amount"
    agree: "23 of 23"
    kind: "copy"
kpis:
  - id: "osa"
    name: "On-shelf availability"
    reads:
      - "book"
    contradicted_by:
      - "audits"
      - "counts"
      - "lines"
    rule: "Book stock is a belief. When an item stops selling while the books show stock, ask for a shelf check."
  - id: "otif"
    name: "On time, in full (OTIF)"
    reads:
      - "receipts"
      - "notice"
    contradicted_by:
      - "counts"
      - "corrections"
    rule: "A receipt booked by scanning a pallet label is a copy of the notice. Check it against the next count."
  - id: "success-rate"
    name: "Payment success rate"
    reads:
      - "payments"
    contradicted_by:
      - "provider"
    rule: "A timeout is a question, not a failure. Match it to the provider's final status before calling it failed."
all_kpis: "https://kvinayakpai.github.io/domain-series/kpis/domain-kpis.yaml"
definitions:
  retail:
    sales: "Units the tills scanned. Sales measure demand only while the item is on the shelf."
    "book stock": "What the system believes is on hand: the last count plus receipts, minus sales and recorded write-offs. A belief, not an observation."
    "shelf audit": "A person looked at the shelf. An observation."
    demand: "What shoppers wanted: sales plus the sales expected in censored hours."
    "in stock": "On the shelf, not on the books. Use audits and censored hours, never the book alone."
  logistics:
    SSCC: "A serial number for a pallet. It identifies the pallet, not what is on it."
    "pick confirmation": "A scan of the slot's label. It confirms where the picker stood, not what was picked."
    "goods receipt": "Booked by scanning the pallet label against the shipping notice. A copy of the notice, not an observation of the cases."
    "in full": "Every case is what was ordered. Only an independent observation can say so: a case scan, a scale, or a later count."
    "count correction": "Says the book was wrong, not why."
  payments:
    "failed: no response": "The till stopped waiting. A question, not an answer: the money may already have moved."
    RRN: "The payment's reference number. A till that hears nothing back never learns it."
    "late credit": "A success in the provider's report after the till gave up. If the bill was paid again, an extra charge."
    "refund wait": "Measured from the extra debit, not from the complaint."
    "technical decline rate": "Counts failures the switch reported. Timeouts are not in it; read it by the hour."
rules:
  across:
    - "Before acting on a KPI, find the record it reads. If that record is a copy, find an observation that can contradict it, and join it."
    - "A join that has never disagreed is a copy. A test on it can only pass."
    - "Silence and timeouts are questions: no sale while the books show stock, and no answer from the bank, are not zeros."
    - "When an observation disagrees, follow the copies back to the event that wrote them, across departments."
    - "Name the things no record looks at. In June at Store 014, nothing looked at what was on a pallet."
  retail:
    - "Treat as censored every open hour with no stock on the books, and every run of no sales longer than the item's usual rate allows while the books show stock."
    - "If sales resume without a delivery, the stock was in the store all along."
    - "Never compare sales across periods without removing censored hours."
  logistics:
    - "Pair count corrections before you explain them: equal and opposite in cases, in one family, in neighbouring slots, at one count, or across the two buildings."
    - "Trace a warehouse pair to the picks of the item that came up over, from its slot, in the cases the pair moved, in the week before."
    - "A receipt that does not survive the next count was not what its notice said."
  payments:
    - "Match every timed-out UPI attempt to the provider's final status by amount and time before calling it failed."
    - "A provider success with no approved till payment is a customer's money until proven otherwise."
    - "Read payment rates by the hour, with timeouts counted, before trusting a monthly rate."
views:
  retail:
    v_hourly_sales: "units the tills recorded per item, day and open hour"
    v_hourly_book: "the book at the end of each open hour, rebuilt from receipts, sales, counts and write-offs"
    v_censored_hours: "open hours the gap detector flagged (1 in 1,000), or with no stock on the books"
    v_demand_estimate: "recorded sales plus the sales expected in censored hours"
  logistics:
    v_corrections: "every count correction in both buildings, in units and in cases"
    v_mirror_pairs: "pairs of corrections in one product family with opposite signs, each at least a case and within 15% of each other in cases, within 7 days: neighbouring slots or one store count, or the same item in both buildings"
    v_receipt_survival: "receipt lines whose next count, within a week, took off half or more of what was booked"
    v_otif_by_delivery: "OTIF per delivery by the warehouse's picks, by the store's receipts, and reconciled with counts"
    v_censored_hours: "5 kg open hours the gap detector flagged, or with no stock on the books"
  payments:
    v_timeouts_matched: "each UPI attempt the till gave up on, matched to the provider's row for it by amount and a start within 5 seconds, one to one, with its final status"
    v_extra_charges: "late credits on bills the customer then paid again"
views_sql: "https://kvinayakpai.github.io/domain-series/kit/store-014-dbt/models/domain/"
tables:
  retail:
    in_the_schema:
      - "daily_sales"
      - "inventory_book"
      - "forecasts"
      - "store_orders"
      - "products"
    added_by_the_layer:
      - "pos_lines"
      - "shelf_audits"
      - "goods_receipts"
      - "stock_counts"
  logistics:
    in_the_schema:
      - "shipments"
      - "notice_lines"
      - "goods_receipts"
      - "store_orders"
      - "inventory_book"
      - "daily_sales"
      - "forecasts"
      - "stock_counts"
      - "products"
    added_by_the_layer:
      - "picks"
      - "pallets"
      - "dc_adjustments"
      - "pos_lines"
  payments:
    in_the_schema:
      - "till_payments"
      - "settlements"
      - "refunds"
      - "complaints"
    added_by_the_layer:
      - "psp_upi"
guardrails:
  about: "Rules written after the posts, for an agent that acts on the retail KPIs. They were not part of the layer the scripted assistant was given, so the Bench results do not depend on them."
  retail:
    - id: "pair-before-shrink"
      kpi: "shrink"
      rule: "Before calling a count loss shrink, pair it with a gain on a sibling item at the same count. Net the pair, and treat only the remainder as a possible loss."
      evidence: "Month-end count, June 2026: toned milk 55 pouches fewer, full-cream milk 48 more. Net 7 pouches; the rest was one pouch scanned as the other."
      check: "v_mirror_pairs"
    - id: "days-of-supply-two-numbers"
      kpi: "days-of-supply"
      rule: "Report days of supply twice: on the books, and on the shelf from audits and censored hours. Do not hold back an order on the first when the second is zero or unknown."
      evidence: "Mid-June, 5 kg atta: 56 bags on the books at a forecast of 24.6 a day is 2.3 days; the shelf had been empty since Wednesday afternoon and the store ordered nothing."
      check: "v_censored_hours"
    - id: "unconstrain-demand"
      kpi: "forecast-accuracy"
      rule: "Fill censored hours with the sales the item usually makes before training or scoring a forecast. Never read a fall in recorded sales during censored hours as a fall in demand."
      evidence: "5 kg atta, June 2026: scored on sales the forecast runs 13% high, scored on the shoppers who came for it, 8% low."
      check: "v_demand_estimate"
